spring.application.name=identity-ms

eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8081/eureka}

# Banco de Dados
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/identity_ms?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Segredo JWT (Deve ter no minimo 256 bits para HMAC-SHA256)
jwt.secret=${JWT_SECRET:SUA_CHAVE_JWT_SECRETA_LOCAL_COM_NO_MINIMO_32_CARACTERES}

# Google OAuth2
oauth2.google.client-id=${GOOGLE_CLIENT_ID:seu_google_client_id}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:seu_google_client_secret}
oauth2.google.redirect-uri=http://localhost:8080/identity-ms/v1/auth/oauth2/callback/google

# GitHub OAuth2
oauth2.github.client-id=${GITHUB_CLIENT_ID:seu_github_client_id}
oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:seu_github_client_secret}
oauth2.github.redirect-uri=http://localhost:8080/identity-ms/v1/auth/oauth2/callback/github

# Frontend
base.url.frontend=${FRONTEND_URL:http://localhost:3000/}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true